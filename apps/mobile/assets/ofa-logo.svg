<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="100%" height="100%">
  <defs>
    <style>
      .ofa-athletic {
        font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        fill: #000000;
        stroke: #FFFFFF;
        stroke-width: 16;
        paint-order: stroke fill;
      }
      .ofa-inner {
        font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        fill: #000000;
        stroke: #FFFFFF;
        stroke-width: 4;
      }
      .sports-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        letter-spacing: 0.32em;
        fill: #FFFFFF;
      }
      .foundation-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        letter-spacing: 0.28em;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Outer White Frame Border -->
  <rect x="20" y="20" width="560" height="620" fill="#000000" stroke="#FFFFFF" stroke-width="8" rx="8" />

  <!-- Upper Black Section Frame -->
  <rect x="36" y="36" width="528" height="460" fill="#000000" />

  <!-- OFA Lettering -->
  <text x="300" y="340" font-size="290" class="ofa-athletic">OFA</text>
  <text x="300" y="340" font-size="290" class="ofa-inner">OFA</text>

  <!-- SPORTS Text -->
  <text x="308" y="450" font-size="68" class="sports-text">SPORTS</text>

  <!-- Lower White Banner -->
  <rect x="28" y="516" width="544" height="116" fill="#FFFFFF" rx="4" />

  <!-- FOUNDATION Text -->
  <text x="308" y="590" font-size="52" class="foundation-text">FOUNDATION</text>
</svg>
